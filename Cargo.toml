[package]
name = "rasant"
version = "1.3.0"
description = "Rasant is a lightweight, high performance and flexible Rust library for structured logging."
authors = ["Lisandro Pin <lisandrop@proton.me>"]
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"
keywords = ["logging"]
repository = "https://github.com/plisandro/rasant"
rust-version = "1.85.0"

include = [
  "Cargo.toml",
  "LICENSE*",
  "src/**/*",
]

[lints.rust]
warnings = "deny"

[lib]
name = "rasant"
path = "src/lib.rs"

[dev-dependencies]
divan = "0.1.21"

[dependencies]
ntime = "0.8.0"

[[bench]]
name = "allocs"
harness = false

[[bench]]
name = "attributes"
harness = false

[[bench]]
name = "filters"
harness = false

[[bench]]
name = "log_write"
harness = false

[[bench]]
name = "sinks"
harness = false

[[bench]]
name = "stress_test"
harness = false
